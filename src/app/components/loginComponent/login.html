<div
  class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8 bg-gradient-to-br from-gray-50 via-white to-gray-100">

  <!-- Card del login -->
  <div class="sm:mx-auto sm:w-full sm:max-w-sm text-center">
    <!-- Icono de inicio de sesión -->
    <div
      class="mx-auto w-30 h-30 flex items-center justify-center rounded-full shadow-lg">
      <a routerLink="/" class=" flex items-center">
       <img src="assets/logo.png" alt="Logo QuejApp" class="w-30 h-30">
      </a>  
    </div>

    <h2 class="mt-4 text-center text-2xl font-bold tracking-tight text-gray-900">Inicia sesión en tu cuenta</h2>
    <p class="mt-2 text-sm text-gray-600">Ingresa tus credenciales para continuar</p>
  </div>

  <!-- Formulario -->
  <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
    <form [formGroup]="loginResquest" (ngSubmit)="onSubmit()"
      class="space-y-6 bg-white rounded-2xl shadow-lg p-6 border border-gray-100">

      <!-- Email -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-900 mb-1">Correo electrónico</label>
        <input id="email" type="email" formControlName="email" required
          class="block w-full px-3 py-2 rounded-lg border border-gray-300 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent" />

      </div>

<!-- Contraseña -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-900 mb-1">Contraseña</label>
        <div class="relative">
          <input id="password" [type]="showPassword ? 'text' : 'password'" formControlName="password" required
            class="block w-full pr-10 px-3 py-2 rounded-lg border border-gray-300 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent" />

          <button type="button" (click)="showPassword = !showPassword"
            [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-500 hover:text-gray-700 focus:outline-none">
            @if (!showPassword) {
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            } @else {
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
              </svg>
            }
          </button>
        </div>
      </div>

      <div class="text-right -mt-3">
        <a routerLink="/forgot-password"
          class="text-sm font-semibold text-orange-500 hover:text-orange-600">
          ¿Olvidaste tu contraseña?
        </a>
      </div>

      @if (errorMessage) {
      <span class="flex items-center text-red-600 text-sm mt-1">
        <svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd"
            d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" />
        </svg>
        {{ errorMessage }}
      </span>
      }

      <!-- Botón -->
      <div>
        <button type="submit" [disabled]="!loginResquest.valid || isLoading"
          class="flex w-full justify-center items-center rounded-lg bg-gradient-to-r from-orange-500 to-orange-600 px-4 py-2 text-white font-semibold shadow hover:from-orange-600 hover:to-orange-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-orange-500 disabled:opacity-50 disabled:cursor-not-allowed">

          <!-- Loading Spinner -->
          @if(isLoading){
          <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
            viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
            </path>
          </svg>
          }

          @if(!isLoading){
          <span>Iniciar sesión</span>
          }
          @if(isLoading){
          <span>Iniciando sesión...</span>
          }

        </button>
      </div>

      <!-- Link registro -->
      <p class="mt-6 text-center text-sm text-gray-600">
        ¿No tienes una cuenta?
        <a routerLink="/register/user" class="font-semibold text-orange-500 hover:text-orange-600 cursor-pointer">
          Crear cuenta
        </a>
      </p>

    </form>
  </div>
</div>
